        ::-webkit-scrollbar-track { background:#f1f5f9; }
        ::-webkit-scrollbar-thumb { background:#94a3b8; border-radius:2px; }

        /* ── LOADER ── */
        .loader-curtain { position:fixed; inset:0; z-index:9999; background:#020617; display:flex; align-items:center; justify-content:center; transition:transform 1.2s cubic-bezier(0.8,0,0.2,1); }
        .loader-content { transition:opacity 0.5s ease; }
        .loaded .loader-curtain { transform:translateY(-100%); }
        .loaded .loader-content { opacity:0; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

        /* ── GOLD ── */
        @keyframes goldShimmer { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
        .gold-text { background:linear-gradient(90deg,#d4a017,#f5c842,#b8860b,#f5c842,#d4a017); background-size:300% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:goldShimmer 3s linear infinite; }
        .gold-bg  { background:linear-gradient(135deg,#d4a017,#f5c842); }
        .gold-border { border-color:#d4a017 !important; }

        /* ── PROMO ── */
        @keyframes redPulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)} 50%{box-shadow:0 0 30px 8px rgba(239,68,68,.2)} }
        .promo-pulse { animation:redPulse 2.5s ease-in-out infinite; }
        @keyframes flashBadge { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.85;transform:scale(1.04)} }
        .flash-badge { animation:flashBadge 1.8s ease-in-out infinite; }
        @keyframes gradientFlow { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
        .gradient-flow-bg { background:linear-gradient(270deg,#dc2626,#ef4444,#b91c1c,#7f1d1d); background-size:400% 400%; animation:gradientFlow 3s ease infinite; }

        /* ── HERO ── */
        .hero-slide { position:absolute; inset:0; opacity:0; transition:opacity 1.5s ease-in-out; background-size:cover; background-repeat:no-repeat; background-position:center; }
        .hero-slide.active { opacity:1; }
        .desktop-hero { display:none; position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
        @media(min-width:768px) { #hero-slides{display:none;} .desktop-hero{display:block;} }
        .reveal-fade { opacity:0; transform:translateY(20px); transition:opacity .8s ease, transform .8s ease; }
        .reveal-fade.active { opacity:1; transform:translateY(0); }
        @keyframes float-subtle { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
        .anim-float { animation:float-subtle 3s ease-in-out infinite; }

        /* ── HERO MARQUEE ── */
        .marquee-wrapper { position:absolute; bottom:0; left:0; width:100%; background:#fff; padding:.75rem 0; z-index:50; overflow:hidden; white-space:nowrap; border-top:1px solid #e2e8f0; }
        .marquee-content { display:inline-block; animation:marquee-roll 22s linear infinite; }
        @keyframes marquee-roll { from{transform:translateX(0)} to{transform:translateX(-50%)} }

        /* ── SECTIONS ── */
        @keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
        .anim-entry { opacity:0; animation:slideUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-play-state:paused; }

        /* ── CURATOR ── */
        @keyframes slowFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
        .curator-img-float { animation:slowFloat 8s ease-in-out infinite; }
        .curator-reveal { opacity:0; transform:translateY(32px); transition:all .9s cubic-bezier(.16,1,.3,1); }
        .curator-active .curator-reveal { opacity:1; transform:translateY(0); }

        /* ── PROCESS CARD ── */
        .process-card { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:1.5rem; padding:2rem; transition:all .4s; position:relative; overflow:hidden; }
        .process-card::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(59,130,246,.06),transparent); opacity:0; transition:opacity .4s; }
        .process-card:hover { transform:translateY(-6px); border-color:rgba(59,130,246,.3); box-shadow:0 20px 40px -10px rgba(2,6,23,.6); }
        .process-card:hover::before { opacity:1; }

        /* ── FEATURE CARDS (dark) ── */
        .feat-card { background:linear-gradient(180deg,rgba(30,41,59,.5),rgba(15,23,42,.8)); border:1px solid rgba(255,255,255,.05); border-radius:2rem; transition:all .5s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden; }
        .feat-card::after { content:''; position:absolute; inset:0; background:radial-gradient(circle at top right,rgba(59,130,246,.12),transparent 60%); opacity:0; transition:opacity .5s; }
        .feat-card:hover::after { opacity:1; }
        .feat-card:hover { transform:translateY(-6px); border-color:rgba(59,130,246,.3); box-shadow:0 20px 40px -15px rgba(2,6,23,.8); }

        /* ── CAR CARDS ── */
        .car-card { transition:all .4s cubic-bezier(.4,0,.2,1); }
        .car-card:hover { transform:translateY(-4px); box-shadow:0 20px 40px -12px rgba(0,0,0,.15); }
        .snap-scroll-container { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; gap:1.25rem; padding-bottom:1rem; }
        .snap-scroll-container::-webkit-scrollbar { display:none; }
        .car-card-snap { flex:0 0 82vw; scroll-snap-align:center; }
        @media(min-width:640px) { .car-card-snap { flex:0 0 340px; } }
        @media(min-width:768px) { .car-card-snap { flex:0 0 360px; } }

        .wa-btn { background:linear-gradient(135deg,#25d366,#128c7e); border-radius:1rem; transition:all .3s; animation:waPulse 2.5s ease-out infinite; }
        .wa-btn:hover { transform:scale(1.03); box-shadow:0 8px 25px -5px rgba(37,211,102,.5); animation:none; }
        .wa-btn:active { transform:scale(.97); }

        /* ── FILTER PILLS ── */

        .fin-track:hover { animation-play-state:paused; }
        .fin-wrap { overflow:hidden; position:relative; }
        .fin-wrap::before, .fin-wrap::after { content:''; position:absolute; top:0; bottom:0; width:60px; z-index:2; pointer-events:none; }

        .fin-wrap::after  { right:0; background:linear-gradient(to left,#fff,transparent); }

        /* ── CONCIERGE CARDS ── */
        .concierge-card { background:linear-gradient(135deg,#f8fafc,#f1f5f9); border:1px solid #e2e8f0; border-radius:1.5rem; padding:2rem; position:relative; overflow:hidden; transition:all .4s; }

        /* ── LEGACY TIMELINE ── */
        .timeline-item { position:relative; padding-left:3rem; }

        /* ── MOBILE NAV ── */
        #mobile-menu { display:none; }
        #mobile-menu.open { display:flex; }
    </style>
</head>

const supabaseKey = 'sb_publishable_3GArnWyMnPKa426JlLPWJQ_Wa6Kd-P5';
const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

const DB = {
    inventory: { all:[], inStock:[], importable:[] },
    weddingFleet: [],
    heroImages: [
        "https://i.ibb.co/zhWCY3t3/Best-Cars.png","https://i.ibb.co/gMwFSm5d/Best-Cars2.png",
        "https://i.ibb.co/gM0CFQbX/Best-Cars7.png","https://i.ibb.co/GfLm2Pv5/Best-Cars8.png"
    ]
};

async function loadData() {
    try {
        const { data:cars } = await supabaseClient.from('inventory').select('*');
        if(cars){ DB.inventory.all=cars; DB.inventory.inStock=cars.filter(c=>c.status==='In Stock'); DB.inventory.importable=cars.filter(c=>c.status==='Importable'); }
        const { data:wedding } = await supabaseClient.from('wedding_fleet').select('*');
        if(wedding) DB.weddingFleet=wedding;
    } catch(e){ console.error("Data error:",e); }
}

function renderComponent(html) {
    const d = document.createElement('div');
    d.innerHTML = html;
    const scripts = Array.from(d.querySelectorAll('script'));
    scripts.forEach(s=>s.remove());
    return {html:d.innerHTML, scripts};
}

}

const App = {
    init: async () => {
        const cfg = window.SITE_CONFIG;
        document.title = cfg.brand.metaTitle;
        const md = document.getElementById('meta-desc'); if(md) md.content = cfg.brand.metaDescription;
        document.getElementById('pl-est').textContent = cfg.brand.established;
        document.getElementById('pl-loc').textContent = cfg.brand.location;
        document.getElementById('pl-status-label').textContent = cfg.preloader.statusLabel;

        const navRes = renderComponent(NavBar());
        document.getElementById('nav-container').innerHTML = navRes.html;
        navRes.scripts.forEach(s=>{ const n=document.createElement('script'); n.text=s.innerHTML; document.body.appendChild(n).parentNode.removeChild(n); });

        document.getElementById('footer-container').innerHTML = FooterSection();
        initFloatWA();

        await loadData();
        App.navigate('home');

        // Loader
        let progress = 0;
        const bar = document.getElementById('loader-bar'), count = document.getElementById('loader-count'), text = document.getElementById('loader-text');
        const states = cfg.preloader.states;
        if(text) text.innerText = states[0];
        const interval = setInterval(() => {
            progress += Math.floor(Math.random()*3)+1;
            if(progress>100) progress=100;
            if(bar) bar.style.width=`${progress}%`;
            if(count) count.innerText=progress.toString().padStart(2,'0');
            if(text && progress%20===0 && progress<100) text.innerText=states[Math.floor(progress/25)]||states[0];
            if(progress===100){
                if(text) text.innerText=states[4];
                clearInterval(interval);
                setTimeout(()=>{ document.body.classList.remove('loading'); document.body.classList.add('loaded'); }, 800);
            }
        }, 25);
    },

    navigate: (page) => {
        window.scrollTo({top:0, behavior:'smooth'});
        const app = document.getElementById('app');
        let content = '';
        if(page==='home'){
            content = ShareFlyerScript()+HeroSection()+StatsSection()+CuratorSection()+LegacySection()+FeaturedInventory()+ProcessSection()+ConciergeSection()+NetworkSection()+LocationSection()+FinancialPartnersSection();
        } else if(page==='stock'){
            content = ShareFlyerScript()+FullInventory()+FinancialPartnersSection()+LocationSection()+NetworkSection();
        } else if(page==='legacy'){
            content = `<div class="pt-20 md:pt-24 bg-lux-900 text-center py-12"><h1 class="text-3xl font-heading font-bold text-white">Our Heritage</h1></div>`+LegacySection()+CuratorSection();
        } else if(page==='wedding'){
            content = WeddingSection()+LocationSection()+NetworkSection();
        } else {
            content = `<div class="pt-32 pb-20 text-center"><h1 class="text-3xl font-heading font-bold">Coming Soon</h1></div>`;
        }
        const processed = renderComponent(content);
        app.style.opacity = '0';
        app.style.transition = 'opacity .2s ease';
        setTimeout(() => {
            app.innerHTML = processed.html;
            processed.scripts.forEach(s => { const n=document.createElement('script'); n.text=s.innerHTML; document.body.appendChild(n).parentNode.removeChild(n); });
            app.style.opacity = '1';
        }, 200);
    }
};

window.addEventListener('load', App.init);
</script>
</body>
</html>
