    <style>
        :root {
            --primary: #2563eb;
            --accent: #0ea5e9;
            --dark: #0f172a;
            --light: #f8fafc;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden; 
            background-color: var(--light); 
        }

        /* Responsive Container */
        .app-shell {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            position: relative;
        }

        @media (min-width: 1024px) {
            .desktop-content-max { max-width: 1200px; margin: 0 auto; }
        }

        /* Premium Scroll Animations */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Hero Image Fading */
        .hero-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out, transform 3s ease-in-out;
            opacity: 0;
            transform: scale(1.15);
        }
        .hero-bg.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Infinite Auto-Scroll Animation */
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .auto-scroll-container {
            display: flex;
            width: max-content;
            animation: scroll 40s linear infinite;
        }

        /* Magnetic Button Feel */
        .btn-premium {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-premium:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.2);
        }

        /* Glassmorphism */
        .glass-header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Hide Scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom Shapes */
        .blob-shape {
            border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
        }

        .car-card:hover .car-img {
            transform: scale(1.08);
        }
    </style>
</head>

        function navigateTo(pageId) {
            const container = document.getElementById('page-render');
            container.style.opacity = '0';
            
            setTimeout(() => {
                container.innerHTML = PAGES[pageId]();
                container.style.opacity = '1';
                window.scrollTo(0, 0);
                
                // Update nav dots/colors
                document.querySelectorAll('.nav-link').forEach(link => {
                    if(link.dataset.page === pageId) link.classList.add('text-blue-600');
                    else link.classList.remove('text-blue-600');
                });

                if (pageId === 'home') initHero();
                else stopHero();
                
                initScrollObserver();
            }, 500);
        }

        let currentHeroIdx = 0;
        let heroInterval;
        function initHero() {
            const slider = document.getElementById('hero-slider');
            if(!slider) return;
            slider.innerHTML = HERO_IMAGES.map((img, i) => `<div class="hero-bg ${i===0?'active':''}" style="background-image: url('${img}')"></div>`).join('');
            
            clearInterval(heroInterval);
            heroInterval = setInterval(() => {
                const bgs = document.querySelectorAll('.hero-bg');
                bgs[currentHeroIdx].classList.remove('active');
                currentHeroIdx = (currentHeroIdx + 1) % HERO_IMAGES.length;
                bgs[currentHeroIdx].classList.add('active');
            }, 6000);
        }

        function stopHero() { clearInterval(heroInterval); }

        function toggleMenu(isOpen) {
            document.getElementById('side-menu').style.transform = isOpen ? 'translateX(0)' : 'translateX(100%)';
        }

        function initScrollObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.15 });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            const logo = document.getElementById('logo-img');
            if (window.scrollY > 80) {
                header.classList.add('glass-header', 'shadow-sm');
                logo.classList.remove('brightness-0', 'invert');
            } else {
                header.classList.remove('glass-header', 'shadow-sm');
                logo.classList.add('brightness-0', 'invert');
            }
        });

        window.onload = () => navigateTo('home');
    </script>
