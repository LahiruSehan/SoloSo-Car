                        function applyFilters() {
                            const activeStatus = document.querySelector('.filter-btn[data-group="status"].active').getAttribute('data-val');
                            const activeCondition = document.querySelector('.filter-btn[data-group="condition"].active').getAttribute('data-val');

                                const statusMatch = activeStatus === 'all' || status === activeStatus;
                                const conditionMatch = activeCondition === 'all' || condition === activeCondition;

        // =================================================================

                navRes.scripts.forEach(s => eval(s.innerHTML));

                document.getElementById('footer-container').innerHTML = FooterSection();

                // Load Data from Supabase
                await loadData();

                // Start at Home

                // Remove preloader
                let progress = 0;
                const bar = document.getElementById('loader-bar');
                const count = document.getElementById('loader-count');
                const text = document.getElementById('loader-text');
                const states = ["Initializing...", "Loading Assets...", "Connecting...", "Preparing...", "Welcome."];

                const interval = setInterval(() => {
                    progress += Math.floor(Math.random() * 3) + 1;
                    if (progress > 100) progress = 100;
                    if (bar) bar.style.width = `${progress}%`;
                    if (count) count.innerText = progress.toString().padStart(2, '0');
                    if (text && progress % 20 === 0 && progress < 100) text.innerText = states[Math.floor(progress / 25)];

                    if (progress === 100) {
                        if (text) text.innerText = states[4];
                        clearInterval(interval);
                        setTimeout(() => {
                            document.body.classList.remove('loading');
                            document.body.classList.add('loaded');
                        }, 800);
                    }
                }, 25);
            },

                setTimeout(() => {
                    app.innerHTML = processed.html;
                    processed.scripts.forEach(script => {
                        const newScript = document.createElement("script");
                        newScript.text = script.innerHTML;
                        document.body.appendChild(newScript).parentNode.removeChild(newScript);
                    });
                    app.style.opacity = '1';
                }, 200);
            }
        };
