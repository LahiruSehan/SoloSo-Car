        /* ========================================================
           SCROLL ANIMATION SYSTEM
           ======================================================== */

        /* Base hidden state */
        [data-scroll] {
            opacity: 0;
            transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
            transition-property: opacity, transform, filter;
            will-change: opacity, transform;
        }
        [data-scroll].in-view { opacity: 1 !important; transform: none !important; filter: none !important; }

        /* Slide up (default) */
        [data-scroll="fade-up"] { transform: translateY(40px); transition-duration: 0.7s; }
        /* Slide from left */
        [data-scroll="fade-left"] { transform: translateX(-60px); transition-duration: 0.8s; }
        /* Slide from right */
        [data-scroll="fade-right"] { transform: translateX(60px); transition-duration: 0.8s; }
        /* Scale up */
        [data-scroll="scale-up"] { transform: scale(0.85); transition-duration: 0.6s; }
        /* Flip in from bottom */
        [data-scroll="flip"] { transform: perspective(800px) rotateX(20deg) translateY(30px); transition-duration: 0.9s; }
        /* Slide down from top */
        [data-scroll="fade-down"] { transform: translateY(-40px); transition-duration: 0.7s; }
        /* Zoom + blur */
        [data-scroll="zoom-blur"] { transform: scale(0.9); filter: blur(8px); transition-duration: 0.8s; }
        /* Rotate in */
        [data-scroll="rotate-in"] { transform: rotate(-8deg) scale(0.9); transition-duration: 0.7s; }
        /* Skew in */
        [data-scroll="skew-in"] { transform: skewY(3deg) translateY(30px); transition-duration: 0.8s; }
        /* Float (for badges/pills) */
        [data-scroll="float"] { transform: translateY(20px) scale(0.95); transition-duration: 0.5s; }

        /* Stagger delays */
        [data-delay="100"] { transition-delay: 0.1s; }
        [data-delay="150"] { transition-delay: 0.15s; }
        [data-delay="200"] { transition-delay: 0.2s; }
        [data-delay="250"] { transition-delay: 0.25s; }
        [data-delay="300"] { transition-delay: 0.3s; }
        [data-delay="350"] { transition-delay: 0.35s; }
        [data-delay="400"] { transition-delay: 0.4s; }
        [data-delay="500"] { transition-delay: 0.5s; }
        [data-delay="600"] { transition-delay: 0.6s; }
        [data-delay="700"] { transition-delay: 0.7s; }

        .road-section {

        /* Center dashed line */

            left: 0;
            width: 200%;
            height: 3px;
            transform: translateY(-50%);
            background: repeating-linear-gradient(

        }
        /* Edge lines */
        .road-edge-top {
            position: absolute;
            top: calc(50% - 30px);
            left: 0;
            width: 200%;
            height: 2px;
            background: repeating-linear-gradient(
                90deg,
                rgba(255,255,255,0.6) 0px,
                rgba(255,255,255,0.6) 20px,
                transparent 20px,
                transparent 40px
            );
            animation: roadLineMove 0.6s linear infinite;
        }
        .road-edge-bottom {
            position: absolute;
            top: calc(50% + 28px);
            left: 0;
            width: 200%;
            height: 2px;
            background: repeating-linear-gradient(
                90deg,
                rgba(255,255,255,0.6) 0px,
                rgba(255,255,255,0.6) 20px,

        /* Cars moving LEFT to RIGHT (correct direction) */
        .road-car {
            position: absolute;
            top: 50%;
            font-size: 26px;
            line-height: 1;

            /* Cars face right naturally as emoji — correct direction */
        }
        /* Upper lane — cars go left to right */
        .road-car.lane-top {
            margin-top: -32px;
        }
        /* Lower lane — cars also go left to right, slightly offset */
        .road-car.lane-bottom {
            margin-top: 8px;
        }
        @keyframes carDriveLTR {
            0%   { transform: translateX(-120px) scaleX(-1); opacity: 0; }
            5%   { opacity: 1; }

            100% { transform: translateX(calc(100vw + 120px)) scaleX(-1); opacity: 0; }
        }

        /* Speed lines behind cars */
        .road-speed-line {
            position: absolute;
            height: 2px;
            border-radius: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);

    </style>
</head>

// ================================================================
// SCROLL ANIMATION ENGINE
// ================================================================
function initScrollAnimations() {
    const elements = document.querySelectorAll('[data-scroll]');
    if (!elements.length) return;

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('in-view');
                // Don't unobserve — keeps animation if scrolled away and back
            }
        });
    }, {
        threshold: 0.12,
        rootMargin: '0px 0px -40px 0px'
    });

    elements.forEach(el => observer.observe(el));
}

// Re-run after every navigation
function runScrollAnimations() {
    setTimeout(initScrollAnimations, 100);
}

        if(cars){ DB.inventory.all=cars; DB.inventory.inStock=cars.filter(c=>c.status==='In Stock'); DB.inventory.importable=cars.filter(c=>c.status==='Importable'); }
        const { data:wedding } = await supabaseClient.from('wedding_fleet').select('*');
        if(wedding) DB.weddingFleet=wedding;
    } catch(e){ console.error("Data error:",e); }
    try {
        const r = await fetch('images/manifest.json');
        if(r.ok){ const files=await r.json(); DB.localCars=files.map(f=>({image:'images/'+f,local:true})); }
    } catch(e){ console.warn("Local images manifest not found:",e); }
    try {
        const r = await fetch('images/clientimages/manifest.json');
        if(r.ok){ const files=await r.json(); DB.clientImages=files.map(f=>'images/clientimages/'+f); }
    } catch(e){ console.warn("Client images manifest not found:",e); }
}

function renderComponent(html) {
    const d = document.createElement('div');
    d.innerHTML = html;
    const scripts = Array.from(d.querySelectorAll('script'));
    scripts.forEach(s=>s.remove());
    return {html:d.innerHTML, scripts};
}

            }
        });

    if(sec) obs.observe(sec);
})();
<\/script>`;
};

// ================================================================

const App = {
    init: async () => {
        const cfg = window.SITE_CONFIG;
        document.title = cfg.brand.metaTitle;
        const md = document.getElementById('meta-desc'); if(md) md.content = cfg.brand.metaDescription;
        document.getElementById('pl-est').textContent = cfg.brand.established;
        document.getElementById('pl-loc').textContent = cfg.brand.location;
        document.getElementById('pl-status-label').textContent = cfg.preloader.statusLabel;

        const navRes = renderComponent(NavBar());
        document.getElementById('nav-container').innerHTML = navRes.html;
        navRes.scripts.forEach(s=>{ const n=document.createElement('script'); n.text=s.innerHTML; document.body.appendChild(n).parentNode.removeChild(n); });

        document.getElementById('footer-container').innerHTML = FooterSection();
        initFloatWA();

        await loadData();
        App.navigate('home');

        // Loader
        let progress = 0;
        const bar = document.getElementById('loader-bar'), count = document.getElementById('loader-count'), text = document.getElementById('loader-text');
        const states = cfg.preloader.states;
        if(text) text.innerText = states[0];
        const interval = setInterval(() => {
            progress += Math.floor(Math.random()*3)+1;
            if(progress>100) progress=100;
            if(bar) bar.style.width=`${progress}%`;
            if(count) count.innerText=progress.toString().padStart(2,'0');
            if(text && progress%20===0 && progress<100) text.innerText=states[Math.floor(progress/25)]||states[0];
            if(progress===100){
                if(text) text.innerText=states[4];
                clearInterval(interval);
                setTimeout(()=>{ document.body.classList.remove('loading'); document.body.classList.add('loaded'); }, 800);
            }
        }, 25);
    },

    navigate: (page) => {
        window.scrollTo({top:0, behavior:'smooth'});
        const app = document.getElementById('app');
        let content = '';
        if(page==='home'){
            content = ShareFlyerScript()+HeroSection()+ServicesSection()+StatsSection()+CarsSoldSection()+CertifiedSection()+CuratorSection()+ServicePartnersSection()+LegacySection()+FeaturedInventory()+ProcessSection()+ConciergeSection()+OurClientsSection()+NetworkSection()+LocationSection()+FinancialPartnersSection();
        } else if(page==='stock'){
            content = ShareFlyerScript()+FullInventory()+FinancialPartnersSection()+LocationSection()+NetworkSection();
        } else if(page==='legacy'){
            content = `<div class="pt-20 md:pt-24 bg-lux-900 text-center py-12"><h1 class="text-3xl font-heading font-bold text-white">Our Heritage</h1></div>`+LegacySection()+CuratorSection();
        } else if(page==='wedding'){
            content = WeddingSection()+LocationSection()+NetworkSection();
        } else {
            content = `<div class="pt-32 pb-20 text-center"><h1 class="text-3xl font-heading font-bold">Coming Soon</h1></div>`;
        }
        const processed = renderComponent(content);
        app.style.opacity = '0';
        app.style.transition = 'opacity .2s ease';
        setTimeout(() => {
            app.innerHTML = processed.html;
            processed.scripts.forEach(s => { const n=document.createElement('script'); n.text=s.innerHTML; document.body.appendChild(n).parentNode.removeChild(n); });
            app.style.opacity = '1';
            // Initialize scroll animations after content renders
            runScrollAnimations();
        }, 200);
    }
};

window.addEventListener('load', App.init);
</script>
